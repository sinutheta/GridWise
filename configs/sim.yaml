tie_break_eps: 1.0e-4          # Prefer earlier start if cost difference < eps
bootstrap_samples: 500
bootstrap_block_days: 1        # Resample in daily blocks (48 slots)
output_dir: "results/tables"
figures_dir: "results/figures"
