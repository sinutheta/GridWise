seed_list: [0, 1, 2, 3, 4]
data:
  lookback: 336
  horizon: 96
  future_weather: false
model:
  blocks: 3
  pool: [8, 4, 1]
  hidden: 128
  dropout: 0.25
  quantiles: null
  instance_norm: true
  predict_change: true
loss:
  type: decision
  lam: 0.1
  tau: 5.0
  d_list: [2, 4, 8, 16]
  slack_list: [12, 24, 48]
  anneal_tau: true
train:
  lr: 3.0e-4
  weight_decay: 1.0e-3
  epochs: 50
  batch_size: 256
  early_stop_patience: 5
  early_stop_metric: val_regret
